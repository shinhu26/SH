<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2b2f31">
  <title>進貨/領料管理系統</title>

  <meta name="application-name" content="新湖進領料">
  <meta name="apple-mobile-web-app-title" content="新湖進領料">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">

  <link id="appFavicon" rel="icon" type="image/png">
  <link id="appleTouchIcon" rel="apple-touch-icon" sizes="180x180">
  <script>
    (function buildAppIcon() {
      try {
        const canvas = document.createElement("canvas");
        canvas.width = 180;
        canvas.height = 180;
        const ctx = canvas.getContext("2d");
        if (!ctx) return;

        const grad = ctx.createLinearGradient(0, 0, 180, 180);
        grad.addColorStop(0, "#7ee0a8");
        grad.addColorStop(1, "#3ba86b");
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 180, 180);

        ctx.fillStyle = "#123824";
        ctx.font = "900 64px 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("新湖", 90, 94);

        const dataUrl = canvas.toDataURL("image/png");
        document.getElementById("appFavicon").href = dataUrl;
        document.getElementById("appleTouchIcon").href = dataUrl;
      } catch (e) {}
    })();
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #2b2f31;
    }
    /* iframe 從安全區（瀏海／狀態列）下方開始，上方固定露出深灰色帶 */
    .gas-frame {
      position: fixed;
      top: env(safe-area-inset-top, 0px);
      right: 0;
      bottom: 0;
      left: 0;
      width: 100%;
      height: calc(100% - env(safe-area-inset-top, 0px));
      border: 0;
      display: block;
      background-color: #f5f7f6;
    }
  </style>
</head>
<body>
  <!-- 更新 GAS 時請使用「編輯 → 新版本」，避免 /exec 網址變動 -->
  <iframe
    id="gasAppFrame"
    class="gas-frame"
    title="進貨/領料管理系統"
    src="https://script.google.com/macros/s/AKfycbwmPVy-p_j60QtWAgHTHKCOjnn7Hkg1X6aG4YywhJ3itFZLykeyjb1NCiD5dJQuxZSL/exec"
    allow="camera">
  </iframe>
</body>
</html>
